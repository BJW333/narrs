[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "narrs"
version = "0.1.0"
description = "Noise-Aware Robust Region Search: a black-box optimizer that finds stable parameter regions instead of overfit points."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Blake" }
]
keywords = ["optimization", "black-box", "robust", "hyperparameter", "backtesting", "noisy-optimization", "overfitting", "cvar", "pbo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
fast = ["scipy>=1.10"]              # enables the KD-tree neighbor backend
bench = ["optuna>=3.0", "cma>=3.2"] # external baselines for the benchmark battery
dev = ["pytest>=7.0", "scipy>=1.10", "optuna>=3.0", "cma>=3.2"]

[tool.setuptools.packages.find]
include = ["narrs*"]
